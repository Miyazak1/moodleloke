server {
  listen 80;
  server_name _;

  # Past-paper PDFs are admin-only uploads. Keep this aligned with
  # PAST_PAPER_UPLOAD_LIMIT_MB in docker-compose.prod.yml.
  client_max_body_size 100m;
  client_body_timeout 120s;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream backend:3000;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /uploads/past-papers/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /health {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location /ops/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  # Serve prerendered public routes at their canonical, no-trailing-slash URLs.
  location = /about {
    try_files /about/index.html =404;
  }

  location = /about/ {
    return 308 /about;
  }

  location = /csca-prep {
    try_files /csca-prep/index.html =404;
  }

  location = /csca-prep/ {
    return 308 /csca-prep;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
